<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - RAG Project</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dbeafe, #eef2ff);
            margin: 0;
            padding: 20px;
        }

        .login-box {
            width: min(420px, 100%);
            background: white;
            padding: 32px;
            border-radius: 16px;
            box-shadow: 0 18px 45px rgba(30, 58, 138, 0.18);
        }

        h1 {
            text-align: center;
            color: #1e3a8a;
            margin: 0 0 8px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 24px;
        }

        label {
            display: block;
            margin-top: 14px;
            color: #334155;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            border-color: #2563eb;
            outline: 3px solid rgba(37, 99, 235, 0.12);
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .error {
            background: #fef2f2;
            color: #991b1b;
            padding: 11px;
            border-left: 4px solid #dc2626;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .demo {
            background: #eff6ff;
            padding: 13px;
            border-radius: 8px;
            margin-top: 20px;
            color: #1e3a8a;
            font-size: 14px;
            line-height: 1.7;
        }
    </style>
</head>

<body>
    <main class="login-box">
        <h1>RAG Login</h1>
        <div class="subtitle">
            Admin and User Control Panel
        </div>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('login') }}">
            <label for="username">Username</label>
            <input
                id="username"
                type="text"
                name="username"
                placeholder="Enter username"
                required
                autofocus
            >

            <label for="password">Password</label>
            <input
                id="password"
                type="password"
                name="password"
                placeholder="Enter password"
                required
            >

            <button type="submit">Login</button>
        </form>

        <div class="demo">
            <b>Demo accounts</b><br>
            Admin: admin / admin123<br>
            User: user / user123
        </div>
    </main>
</body>
</html>
